<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONIC Create</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Home</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC CREATE STUDIO</div><h1>Start with an idea.<br><span class="gradient">Make it real.</span></h1><p class="lead">Create useful prompts, social captions and project ideas with simple templates.</p></section><section class="panel toolbox"><label>What do you want to create?<select class="field" id="kind"><option value="prompt">AI image prompt</option><option value="caption">Social media caption</option><option value="website">Website idea</option><option value="video">Short video idea</option></select></label><label>Topic or subject<input class="field" id="topic" placeholder="Example: futuristic gaming channel"></label><label>Style / extra details<input class="field" id="style" placeholder="Example: cinematic, minimal, Hindi audience"></label><button class="btn" id="generate">Generate idea ↗</button><div class="result" id="result">Your generated text will appear here.</div><button class="btn secondary" id="copy">Copy result</button><p class="muted">Template-based generator. It does not call an AI model or send your text to a server.</p></section></main><script>let output='';document.getElementById('generate').onclick=()=>{let t=document.getElementById('topic').value.trim(),s=document.getElementById('style').value.trim(),k=document.getElementById('kind').value;if(!t){document.getElementById('result').textContent='Add a topic first.';return}let templates={prompt:'Create a detailed, high-quality visual about '+t+'. Style: '+(s||'modern cinematic').+'. Use a clear focal point, thoughtful composition, rich lighting and polished details. Avoid clutter and keep the subject readable.',caption:'Write 5 engaging social media captions about '+t+'. Tone: '+(s||'friendly and energetic')+'. Include a strong opening, a clear message and relevant hashtags.',website:'Website concept: '+t+'. Suggest a target audience, core problem, 5 useful features, a simple navigation structure and a mobile-first visual direction. Extra direction: '+s,video:'Create a short-form video concept about '+t+'. Style: '+(s||'fast-paced and informative')+'. Give a 3-second hook, scene-by-scene plan, Hindi voiceover outline and a closing CTA.'};output=templates[k];document.getElementById('result').textContent=output};document.getElementById('copy').onclick=()=>{if(output)navigator.clipboard?.writeText(output).then(()=>alert('Copied'))};</script></body></html>
