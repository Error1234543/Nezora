<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONIC Quiz</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Home</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC QUIZ</div><h1>Think fast.<br><span class="gradient">Score big.</span></h1><p class="lead">A quick general knowledge challenge. Ten questions, instant feedback and a score saved only in this browser.</p></section><section class="panel" id="quiz"><div class="row" style="justify-content:space-between"><span class="eyebrow" id="progress">QUESTION 1 / 10</span><span class="score" id="score">0 pts</span></div><h2 id="question">Loading question...</h2><div class="toolbox" id="options"></div><p class="muted" id="feedback" aria-live="polite"></p><button class="btn" id="next" disabled>Next question →</button></section></main><script>const qs=[['Which planet is known as the Red Planet?',['Venus','Mars','Jupiter','Mercury'],1],['How many sides does a hexagon have?',['5','6','7','8'],1],['What is H₂O commonly called?',['Oxygen','Hydrogen','Water','Salt'],2],['Which ocean is the largest?',['Atlantic','Indian','Arctic','Pacific'],3],['What is the capital of Japan?',['Seoul','Tokyo','Beijing','Bangkok'],1],['Which gas do plants absorb?',['Oxygen','Carbon dioxide','Nitrogen','Helium'],1],['How many minutes are in two hours?',['60','90','120','180'],2],['Which is the closest star to Earth?',['Sirius','Sun','Polaris','Vega'],1],['What is 9 × 8?',['64','72','81','89'],1],['Which device stores electrical energy?',['Battery','Mirror','Lens','Speaker'],0]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function draw(){answered=false;$('progress').textContent='QUESTION '+(i+1)+' / '+qs.length;$('score').textContent=score+' pts';$('question').textContent=qs[i][0];$('feedback').textContent='';$('next').disabled=true;$('next').textContent=i===qs.length-1?'See result':'Next question →';$('options').innerHTML='';qs[i][1].forEach((v,k)=>{let b=document.createElement('button');b.className='btn secondary';b.textContent=v;b.style.justifyContent='flex-start';b.onclick=()=>answer(k,b);$('options').append(b)})}function answer(k,b){if(answered)return;answered=true;let ok=k===qs[i][2];if(ok)score+=10;$('score').textContent=score+' pts';$('feedback').textContent=ok?'Correct! +10 points.':'Not quite — the correct answer is '+qs[i][1][qs[i][2]]+'.';[...$('options').children].forEach(x=>x.disabled=true);$('next').disabled=false} $('next').onclick=()=>{if(i<qs.length-1){i++;draw()}else{$('quiz').innerHTML='<div class="eyebrow">QUIZ COMPLETE</div><h2>Your score: '+score+' / 100</h2><p class="muted">Great effort! Play again to improve your personal best.</p><button class="btn" onclick="location.reload()">Play again</button>'}};draw();</script></body></html>
