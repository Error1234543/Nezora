<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS</div><h1>Password <span class="gradient">Generator</span></h1><div class="toolbox panel"><label>Length <input class="field" id="len" type="number" min="8" max="64" value="16"></label><label><input type="checkbox" id="nums" checked> Include numbers</label><label><input type="checkbox" id="symbols" checked> Include symbols</label><button class="btn" id="make">Generate password</button><input class="field" id="out" readonly placeholder="Your password"><button class="btn secondary" id="copy">Copy password</button><p class="muted">Generated locally. Never share your passwords with anyone.</p></div></section></main><script>document.getElementById('make').onclick=()=>{let n=Math.max(8,Math.min(64,Number(document.getElementById('len').value)||16)),chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'+(document.getElementById('nums').checked?'0123456789':'')+(document.getElementById('symbols').checked?'!@#$%^&*()-_=+[]{}?':'');let a=new Uint32Array(n);crypto.getRandomValues(a);document.getElementById('out').value=[...a].map(x=>chars[x%chars.length]).join('')};document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(document.getElementById('out').value).then(()=>alert('Copied'));document.getElementById('make').click();</script></body></html>
