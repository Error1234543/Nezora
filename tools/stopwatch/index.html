<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Stopwatch | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / STOPWATCH</div><h1>Stopwatch <span class="gradient"></span></h1><p class="lead">A simple stopwatch with start, pause and reset.</p><div class="toolbox panel"><div class="score" id="clock" style="font-size:48px">00:00.0</div><div class="row"><button class="btn" id="start">Start</button><button class="btn secondary" id="pause">Pause</button><button class="btn secondary" id="reset">Reset</button></div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();let start=0,elapsed=0,id=null;const c=document.getElementById('clock');function show(){let t=elapsed+(id?Date.now()-start:0),d=Math.floor(t/100),s=Math.floor(d/10),m=Math.floor(s/60);c.textContent=String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+(d%10)}document.getElementById('start').onclick=()=>{if(!id){start=Date.now();id=setInterval(show,100);}};document.getElementById('pause').onclick=()=>{if(id){elapsed+=Date.now()-start;clearInterval(id);id=null;show()}};document.getElementById('reset').onclick=()=>{clearInterval(id);id=null;elapsed=0;show()};show()</script></body></html>
