<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Percentage Calculator | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / PERCENTAGE CALCULATOR</div><h1>Percentage <span class="gradient">Calculator</span></h1><p class="lead">Calculate percentages, percentage change and find what percent one number is of another.</p><div class="toolbox panel"><label>Calculation<select class="field" id="mode"><option value="of">What is X% of Y?</option><option value="is">X is what percent of Y?</option><option value="change">Percentage change from X to Y</option></select></label><input class="field" id="a" type="number" placeholder="Enter X"><input class="field" id="b" type="number" placeholder="Enter Y"><button class="btn" id="go">Calculate</button><div class="result" id="out">Your answer appears here.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const $=id=>document.getElementById(id);$('go').onclick=()=>{let a=Number($('a').value),b=Number($('b').value),m=$('mode').value;if(!$('a').value||!$('b').value||((m==='is'||m==='change')&&b===0)){ $('out').textContent='Enter valid numbers. The second value cannot be zero for this calculation.';return}let n=m==='of'?a*b/100:m==='is'?a/b*100:(b-a)/Math.abs(a||1)*100;$('out').textContent=(m==='of'?a+'% of '+b+' = ':m==='is'?a+' is ':'Change = ')+n.toFixed(2)+(m==='of'?'':'%')}</script></body></html>
