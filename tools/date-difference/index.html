<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Date Difference | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / DATE DIFFERENCE</div><h1>Date <span class="gradient">Difference</span></h1><p class="lead">Find the number of days between two dates.</p><div class="toolbox panel"><input class="field" id="a" type="date"><input class="field" id="b" type="date"><button class="btn" id="go">Find difference</button><div class="result" id="out">Select dates to compare.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const $=id=>document.getElementById(id);$('go').onclick=()=>{let a=new Date($('a').value+'T00:00:00'),b=new Date($('b').value+'T00:00:00');if(!$('a').value||!$('b').value||isNaN(+a)||isNaN(+b)){$('out').textContent='Select both dates.';return}$('out').textContent=Math.abs(Math.round((b-a)/86400000))+' days apart.'}</script></body></html>
