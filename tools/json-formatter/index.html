<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>JSON Formatter | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / JSON FORMATTER</div><h1>JSON <span class="gradient">Formatter</span></h1><p class="lead">Format and validate JSON text in your browser.</p><div class="toolbox panel"><textarea class="field" id="json" placeholder='{"hello":"world"}'></textarea><div class="row"><button class="btn" id="format">Format</button><button class="btn secondary" id="minify">Minify</button></div><div class="result" id="out">Validation status appears here.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const j=document.getElementById('json'),o=document.getElementById('out');function run(compact){try{let v=JSON.parse(j.value);j.value=JSON.stringify(v,null,compact?0:2);o.textContent='Valid JSON.'}catch(e){o.textContent='Invalid JSON: '+e.message}}document.getElementById('format').onclick=()=>run(false);document.getElementById('minify').onclick=()=>run(true)</script></body></html>
