<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Generator | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS</div><h1>QR <span class="gradient">Generator</span></h1><div class="toolbox panel"><input class="field" id="data" placeholder="Enter a link or text"><button class="btn" id="go">Create QR</button><div class="result" id="qr">Your QR code will appear here.</div><p class="muted">QR image is requested from a third-party service. Do not encode private information.</p></div></section></main><script>document.getElementById('go').onclick=()=>{let v=document.getElementById('data').value.trim(),q=document.getElementById('qr');if(!v){q.textContent='Enter text or a link first.';return}let img=document.createElement('img');img.alt='Generated QR code';img.width=220;img.height=220;img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(v);q.replaceChildren(img)};</script></body></html>
