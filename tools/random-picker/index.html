<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Random Picker | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / RANDOM PICKER</div><h1>Random <span class="gradient">Picker</span></h1><p class="lead">Pick a random item from your own list.</p><div class="toolbox panel"><textarea class="field" id="items" placeholder="Enter one option per line"></textarea><button class="btn" id="pick">Pick one</button><div class="result" id="out">Your random pick appears here.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();document.getElementById('pick').onclick=()=>{let a=document.getElementById('items').value.split(/\n/).map(x=>x.trim()).filter(Boolean);document.getElementById('out').textContent=a.length?a[Math.floor(Math.random()*a.length)]:'Add at least one option.'}</script></body></html>
