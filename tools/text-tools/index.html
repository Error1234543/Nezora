<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Toolkit | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS</div><h1>Text <span class="gradient">Toolkit</span></h1><div class="toolbox panel"><textarea class="field" id="txt" placeholder="Type or paste your text..."></textarea><div class="row"><button class="btn" data-case="upper">UPPERCASE</button><button class="btn secondary" data-case="lower">lowercase</button><button class="btn secondary" data-case="title">Title Case</button><button class="btn secondary" id="copy">Copy</button></div><div class="result" id="stats">0 words · 0 characters</div></div></section></main><script>const t=document.getElementById('txt'),st=document.getElementById('stats');function count(){st.textContent=(t.value.trim()?t.value.trim().split(/\s+/).length:0)+' words · '+t.value.length+' characters'}t.oninput=count;document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{let m=b.dataset.case;t.value=m==='upper'?t.value.toUpperCase():m==='lower'?t.value.toLowerCase():t.value.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());count()});document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(t.value).then(()=>alert('Copied'));</script></body></html>
