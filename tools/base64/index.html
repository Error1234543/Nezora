<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Base64 Encoder / Decoder | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / BASE64 ENCODER / DECODER</div><h1>Base64 <span class="gradient">Encoder / Decoder</span></h1><p class="lead">Encode or decode plain text using Base64.</p><div class="toolbox panel"><textarea class="field" id="txt" placeholder="Enter plain text or Base64"></textarea><div class="row"><button class="btn" id="enc">Encode</button><button class="btn secondary" id="dec">Decode</button><button class="btn secondary" id="copy">Copy</button></div><div class="result" id="out">Result appears here.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const t=document.getElementById('txt'),o=document.getElementById('out');document.getElementById('enc').onclick=()=>{try{o.textContent=btoa(unescape(encodeURIComponent(t.value)))}catch{o.textContent='Could not encode.'}};document.getElementById('dec').onclick=()=>{try{o.textContent=decodeURIComponent(escape(atob(t.value.trim())))}catch{o.textContent='Invalid Base64 input.'}};document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(o.textContent).then(()=>alert('Copied'))</script></body></html>
