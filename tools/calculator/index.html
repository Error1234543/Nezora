<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS</div><h1>Quick <span class="gradient">Calculator</span></h1><div class="toolbox panel"><input class="field" id="expr" placeholder="Example: (25 + 5) * 2"><button class="btn" id="calc">Calculate</button><div class="result" id="out">Your result appears here.</div><p class="muted">Supports basic arithmetic and brackets.</p></div></section></main><script>document.getElementById('calc').onclick=()=>{let s=document.getElementById('expr').value.trim(),o=document.getElementById('out');if(!/^[0-9+*/().%\s-]+$/.test(s)||!s){o.textContent='Please enter a valid arithmetic expression.';return}try{let n=Function('"use strict";return ('+s+')')();o.textContent=Number.isFinite(n)?String(n):'Invalid calculation'}catch{o.textContent='Could not calculate that expression.'}};</script></body></html>
