<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← Tools</a></header><main class="wrap"><section class="hero" style="text-align:center"><div class="eyebrow">SONIC TOOLS</div><h1>Focus <span class="gradient">Timer</span></h1><div class="score" id="clock" style="font-size:64px;margin:25px">25:00</div><div class="row" style="justify-content:center"><button class="btn" id="start">Start</button><button class="btn secondary" id="pause">Pause</button><button class="btn secondary" id="reset">Reset</button></div><p class="muted">A simple 25-minute focus session.</p></section></main><script>let left=1500,id=null;const c=document.getElementById('clock');function show(){c.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}document.getElementById('start').onclick=()=>{if(id)return;id=setInterval(()=>{if(left>0){left--;show()}else{clearInterval(id);id=null;alert('Focus session complete!')}},1000)};document.getElementById('pause').onclick=()=>{clearInterval(id);id=null};document.getElementById('reset').onclick=()=>{clearInterval(id);id=null;left=1500;show()};show();</script></body></html>
