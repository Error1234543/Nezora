<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Unit Converter | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / UNIT CONVERTER</div><h1>Unit <span class="gradient">Converter</span></h1><p class="lead">Convert common length, weight and temperature units.</p><div class="toolbox panel"><label>Category<select class="field" id="cat"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select></label><input class="field" id="val" type="number" placeholder="Value"><div class="row"><select class="field" id="from"></select><select class="field" id="to"></select></div><button class="btn" id="go">Convert</button><div class="result" id="out">Converted value appears here.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const $=id=>document.getElementById(id),sets={length:['Meters','Kilometers','Centimeters','Miles','Feet'],weight:['Grams','Kilograms','Pounds','Ounces'],temp:['Celsius','Fahrenheit','Kelvin']};function fill(){let a=sets[$('cat').value];$('from').innerHTML=$('to').innerHTML=a.map(x=>'<option>'+x+'</option>').join('');$('to').selectedIndex=1} $('cat').onchange=fill;fill();$('go').onclick=()=>{let v=Number($('val').value),f=$('from').value,t=$('to').value;if(!$('val').value){$('out').textContent='Enter a value.';return}let factors={Meters:1,Kilometers:1000,Centimeters:.01,Miles:1609.344,Feet:.3048,Grams:1,Kilograms:1000,Pounds:453.59237,Ounces:28.3495};let n;if($('cat').value==='temp'){let c=f==='Celsius'?v:f==='Fahrenheit'?(v-32)*5/9:v-273.15;n=t==='Celsius'?c:t==='Fahrenheit'?c*9/5+32:c+273.15}else n=v*factors[f]/factors[t];$('out').textContent=n.toLocaleString(undefined,{maximumFractionDigits:6})+' '+t}</script></body></html>
