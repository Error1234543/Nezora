<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Date & Age Calculator | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / DATE & AGE CALCULATOR</div><h1>Date <span class="gradient">& Age Calculator</span></h1><p class="lead">Calculate the time between two dates.</p><div class="toolbox panel"><label>Date of birth / start date<input class="field" id="a" type="date"></label><label>End date<input class="field" id="b" type="date"></label><button class="btn" id="go">Calculate duration</button><div class="result" id="out">Choose two dates.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const $=id=>document.getElementById(id);$('b').value=new Date().toISOString().slice(0,10);$('go').onclick=()=>{let a=new Date($('a').value+'T00:00:00'),b=new Date($('b').value+'T00:00:00');if(!$('a').value||!$('b').value||isNaN(+a)||b<a){$('out').textContent='Choose valid dates in chronological order.';return}let days=Math.floor((b-a)/86400000),years=Math.floor(days/365.2425),months=Math.floor((days-years*365.2425)/30.44);$('out').textContent=years+' years, about '+months+' months, '+days+' total days.'}</script></body></html>
