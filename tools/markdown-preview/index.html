<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Markdown Preview | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / MARKDOWN PREVIEW</div><h1>Markdown <span class="gradient">Preview</span></h1><p class="lead">Write basic Markdown and preview it safely as text.</p><div class="toolbox panel"><textarea class="field" id="md" placeholder="# Hello\nWrite your notes here..."></textarea><div class="result" id="preview">Preview appears here.</div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const t=document.getElementById('md'),p=document.getElementById('preview');function render(){let s=t.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');p.innerHTML=s}t.oninput=render;render()</script></body></html>
