<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>Word Counter | SONIC</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../">SON<b>IC</b>.</a><a class="btn secondary" href="../">← All tools</a></header><main class="wrap"><section class="hero"><div class="eyebrow">SONIC TOOLS / WORD COUNTER</div><h1>Word <span class="gradient">Counter</span></h1><p class="lead">Count words, characters, sentences and reading time.</p><div class="toolbox panel"><textarea class="field" id="txt" placeholder="Paste or type your text..."></textarea><div class="grid two"><div class="result" id="words">0 words</div><div class="result" id="chars">0 characters</div><div class="result" id="sentences">0 sentences</div><div class="result" id="time">0 min read</div></div></div></section></main><footer class="wrap footer"><span>© <span class="year"></span> SONIC Universe</span><a href="../">All tools ↑</a></footer><script>document.querySelector('.year').textContent=new Date().getFullYear();const t=document.getElementById('txt');function count(){let s=t.value.trim(),w=s?s.split(/\s+/).length:0;document.getElementById('words').textContent=w+' words';document.getElementById('chars').textContent=t.value.length+' characters';document.getElementById('sentences').textContent=(s?(s.match(/[.!?]+/g)||[]).length:0)+' sentences';document.getElementById('time').textContent=Math.max(0,Math.ceil(w/200))+' min read'}t.oninput=count;count()</script></body></html>
