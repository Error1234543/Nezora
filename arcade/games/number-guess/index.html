<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Guess | SONIC</title><link rel="stylesheet" href="../../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../../">SON<b>IC</b>.</a><a class="btn secondary" href="../../">← Arcade</a></header><main class="wrap"><section class="hero"><div class="eyebrow">ARCADE / SOLO GAME</div><h1>Number <span class="gradient">Guess</span></h1><p class="lead">I'm thinking of a number from 1 to 100. Can you guess it?</p><div class="toolbox panel"><input class="field" id="guess" type="number" min="1" max="100" placeholder="Enter a number (1–100)"><div class="row"><button class="btn" id="check">Check guess</button><button class="btn secondary" id="new">New game</button></div><div class="result" id="result">Make your first guess.</div><p class="muted" id="tries">Attempts: 0</p></div></section></main><script>let n,t;const r=document.getElementById('result'),g=document.getElementById('guess'),tr=document.getElementById('tries');function reset(){n=Math.floor(Math.random()*100)+1;t=0;g.value='';g.disabled=false;document.getElementById('check').disabled=false;r.textContent='Make your first guess.';tr.textContent='Attempts: 0'}document.getElementById('check').onclick=()=>{let v=Number(g.value);if(!Number.isInteger(v)||v<1||v>100){r.textContent='Enter a whole number from 1 to 100.';return}t++;tr.textContent='Attempts: '+t;if(v===n){r.textContent='Correct! You got it in '+t+' tries.';g.disabled=true;document.getElementById('check').disabled=true}else r.textContent=v<n?'Too low — try a higher number.':'Too high — try a lower number.'};document.getElementById('new').onclick=reset;reset();</script></body></html>
