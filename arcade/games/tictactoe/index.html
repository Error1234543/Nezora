<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-Tac-Toe | SONIC</title><link rel="stylesheet" href="../../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../../">SON<b>IC</b>.</a><a class="btn secondary" href="../../">← Arcade</a></header><main class="wrap"><section class="hero" style="text-align:center"><div class="eyebrow">ARCADE / TWO PLAYERS</div><h1>Tic-<span class="gradient">Tac-Toe</span></h1><p class="lead" style="margin:auto">Take turns. Get three in a row to win.</p><div class="score" id="status" style="margin-top:20px">X's turn</div><div class="gameboard ttt" id="board"></div><div class="row" style="justify-content:center"><button class="btn" id="reset">New round</button></div></section></main><script>const b=document.getElementById('board'),s=document.getElementById('status');let a=Array(9).fill(''),p='X',done=false;function draw(){b.innerHTML='';a.forEach((v,i)=>{let x=document.createElement('button');x.className='cell';x.textContent=v;x.setAttribute('aria-label','Cell '+(i+1)+' '+(v||'empty'));x.onclick=()=>move(i);b.append(x)})}function move(i){if(done||a[i])return;a[i]=p;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let w=wins.some(q=>q.every(k=>a[k]===p));draw();if(w){s.textContent=p+' wins!';done=true}else if(a.every(Boolean)){s.textContent='It is a draw!';done=true}else{p=p==='X'?'O':'X';s.textContent=p+\"'s turn\"}}document.getElementById('reset').onclick=()=>{a=Array(9).fill('');p='X';done=false;s.textContent=\"X's turn\";draw()};draw();</script></body></html>
