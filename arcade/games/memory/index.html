<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match | SONIC</title><link rel="stylesheet" href="../../../assets/css/style.css"></head><body><header class="wrap topbar"><a class="brand" href="../../../">SON<b>IC</b>.</a><a class="btn secondary" href="../../">← Arcade</a></header><main class="wrap"><section class="hero" style="text-align:center"><div class="eyebrow">ARCADE / MEMORY</div><h1>Memory <span class="gradient">Match</span></h1><p class="lead" style="margin:auto">Find all eight matching pairs.</p><p class="score" id="moves">Moves: 0</p><div class="gameboard memory" id="board"></div><p id="status" class="muted"></p><button class="btn" id="restart">Shuffle cards</button></section></main><script>const icons=['⚡','🌙','🚀','🎧','💎','🌊','🪐','🔥'];let deck,first=null,lock=false,moves=0,matched=0;const board=document.getElementById('board');function start(){deck=[...icons,...icons].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;matched=0;document.getElementById('moves').textContent='Moves: 0';document.getElementById('status').textContent='';board.innerHTML='';deck.forEach((v,i)=>{let c=document.createElement('button');c.className='cell';c.textContent='?';c.dataset.value=v;c.onclick=()=>flip(c);board.append(c)})}function flip(c){if(lock||c.textContent!=='?'||c.dataset.done)return;c.textContent=c.dataset.value;if(!first){first=c;return}moves++;document.getElementById('moves').textContent='Moves: '+moves;if(first.dataset.value===c.dataset.value){first.dataset.done='1';c.dataset.done='1';matched+=2;first=null;if(matched===16)document.getElementById('status').textContent='You matched every pair! 🎉'}else{lock=true;let prev=first;first=null;setTimeout(()=>{prev.textContent='?';c.textContent='?';lock=false},700)}}document.getElementById('restart').onclick=start;start();</script></body></html>
